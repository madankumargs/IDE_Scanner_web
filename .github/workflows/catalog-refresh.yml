name: Refresh extension catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      scan_batch_limit:
        description: Maximum new Deep Scans to dispatch
        required: false
        default: "100"
      cohort_limit:
        description: Maximum ranked extensions to refresh; increase only after the publication gate passes
        required: false
        default: "250"
      marketplace_page_count:
        description: Marketplace pages of 100 extensions to ingest
        required: false
        default: "3"
      enable_bulk_scan:
        description: Queue the broad public cohort only after an active accuracy-attested release exists
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/refresh-catalog.mjs
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          SCAN_BATCH_LIMIT: ${{ inputs.scan_batch_limit || '100' }}
          CATALOG_COHORT_LIMIT: ${{ inputs.cohort_limit || '250' }}
          MARKETPLACE_PAGE_COUNT: ${{ inputs.marketplace_page_count || '3' }}
          CATALOG_BULK_SCAN_ENABLED: ${{ inputs.enable_bulk_scan || 'false' }}
      - name: Check Cloudflare D1 credentials
        id: d1_credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build public registry mirror from the active Cloudflare release
        if: ${{ steps.d1_credentials.outputs.configured == 'true' }}
        run: npx tsx scripts/build-cloudflare-registry-snapshot.mjs --out public/registry-snapshot.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26e873c5d55e5e386df482c9dbe8bcd7
          CLOUDFLARE_SCAN_DATABASE: abscissa-scan-data
          MARKETPLACE_PAGE_COUNT: ${{ inputs.marketplace_page_count || '3' }}
      - name: Export legacy Supabase registry mirror
        if: ${{ steps.d1_credentials.outputs.configured != 'true' }}
        run: npx tsx scripts/export-public-registry.mjs
        env:
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
      - name: Sync public registry to Cloudflare D1
        if: ${{ steps.d1_credentials.outputs.configured == 'true' }}
        run: |
          node scripts/import-public-registry-d1.mjs public/registry-snapshot.json .tmp/public-registry-d1.sql
          npx wrangler d1 execute abscissa-registry --remote --file=.tmp/public-registry-d1.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26e873c5d55e5e386df482c9dbe8bcd7
      - name: Warn when Cloudflare D1 sync is not configured
        if: ${{ steps.d1_credentials.outputs.configured != 'true' }}
        run: echo "::warning::Cloudflare D1 sync is waiting for the CLOUDFLARE_API_TOKEN repository secret."
      - name: Publish public registry mirror
        run: |
          if [ -z "$(git status --short -- public/registry-snapshot.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/registry-snapshot.json
          git commit -m "chore: refresh public registry mirror [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Verify public release health
        env:
          LAUNCH_HEALTH_URL: https://abscissa.dev
          LAUNCH_HEALTH_SECRET: ${{ secrets.LAUNCH_HEALTH_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/verify-release-health.mjs
